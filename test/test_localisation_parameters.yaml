/**:
  ros__parameters:
    debug: true
    log_directory: "foo"
    base_footprint_frame_id: "base_link"
    map_frame_id: "map"
    publish_rate: "10"
    filter:
      state_pool_size: 1000
      number_of_particles: 200
    predictor:
      maximal_dead_recknoning_travelled_distance: 10.0
      maximal_dead_recknoning_elapsed_time: 3.0
    angular_speed_updater:
      topic: angular_speed
      minimal_rate: 10
    linear_speeds_updater:
      topic: twist
      minimal_rate: 10
    position_updater:
      topic: position
      minimal_rate: 1
      trigger: always
      mahalanobis_distance_rejection_threshold: 3.0
    course_updater:
      topic: course
      minimal_rate: 1
      trigger: once
    attitude_updater:
      topic: attitude
      minimal_rate: 10
    pose_updater:
      topic: pose
      minimal_rate: 1
      trigger: once
    range_updater:
      topic: range
      minimal_rate: 10
      trigger: always
